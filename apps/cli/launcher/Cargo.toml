[package]
name = "cooper-launcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[[bin]]
name = "cooper"
path = "src/main.rs"

[dependencies]
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
